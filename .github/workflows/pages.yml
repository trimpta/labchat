name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject Python Code into HTML
        run: |
          python3 -c '
          import sys
          html = open("index.html").read()
          code = open("labchat.py").read()
          # We replace the "Loading labchat.py..." placeholder and the script tag if needed,
          # but just replacing the placeholder is enough.
          # To be safe, we will replace the text content of the code block.
          import re
          new_html = re.sub(
              r"(<code id=\"source-code\">)(.*?)(</code>)",
              lambda m: m.group(1) + code.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;") + m.group(3),
              html,
              flags=re.DOTALL
          )
          new_html = re.sub(r"fetch\('labchat\.py.*?\}\);", "", new_html, flags=re.DOTALL)
          open("index.html", "w").write(new_html)
          '
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
